<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Background Obsidian Gradient -->
    <linearGradient id="hsBadgeBg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B1B24" />
      <stop offset="60%" stop-color="#111117" />
      <stop offset="100%" stop-color="#0B0B0F" />
    </linearGradient>

    <!-- Border Glint Gradient -->
    <linearGradient id="hsBorder" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.75" />
      <stop offset="35%" stop-color="#FF5500" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#2D2D3D" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1A1A26" stop-opacity="0.9" />
    </linearGradient>

    <!-- Front Strand: Vibrant Helix Ember -->
    <linearGradient id="hsStrandFront" x1="7" y1="5" x2="25" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA266" />
      <stop offset="25%" stop-color="#FF6A1A" />
      <stop offset="65%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#D43800" />
    </linearGradient>

    <!-- Back Strand: Luminescent Platinum with Amber Rim -->
    <linearGradient id="hsStrandBack" x1="25" y1="5" x2="7" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Core Watermark Glow -->
    <radialGradient id="hsGlow" cx="16" cy="16" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#FF5500" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Front Overpass -->
    <filter id="hsDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Helix -->
  <circle cx="16" cy="16" r="10" fill="url(#hsGlow)" />

  <!-- Obsidian Seal Badge -->
  <rect
    x="1.2"
    y="1.2"
    width="29.6"
    height="29.6"
    rx="7.5"
    fill="url(#hsBadgeBg)"
    stroke="url(#hsBorder)"
    stroke-width="1.2"
  />

  <!-- Subtle Inner Guide Lattice (Biotech Matrix) -->
  <line x1="8" y1="16" x2="24" y2="16" stroke="#252533" stroke-width="0.8" stroke-dasharray="1.5 2" />

  <!-- Base-Pair Carrier Rungs (Synonymous Codons) -->
  <!-- Rung 1 (Top) -->
  <line x1="10" y1="9" x2="22" y2="9" stroke="#3E3E52" stroke-width="1.4" stroke-linecap="round" />
  <circle cx="13" cy="9" r="1" fill="#94A3B8" />
  <circle cx="19" cy="9" r="1" fill="#FF7A33" />

  <!-- Rung 2 (Upper-Mid) -->
  <line x1="12" y1="12.5" x2="20" y2="12.5" stroke="#4F4F66" stroke-width="1.3" stroke-linecap="round" />

  <!-- Rung 3 (Cryptographic Provenance Watermark - Center Signet) -->
  <line x1="13" y1="16" x2="19" y2="16" stroke="#FF5500" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="16" cy="16" r="2.2" fill="#FF5500" />
  <circle cx="16" cy="16" r="1.1" fill="#FFFFFF" />

  <!-- Rung 4 (Lower-Mid) -->
  <line x1="12" y1="19.5" x2="20" y2="19.5" stroke="#4F4F66" stroke-width="1.3" stroke-linecap="round" />

  <!-- Rung 5 (Bottom) -->
  <line x1="10" y1="23" x2="22" y2="23" stroke="#3E3E52" stroke-width="1.4" stroke-linecap="round" />
  <circle cx="13" cy="23" r="1" fill="#FF7A33" />
  <circle cx="19" cy="23" r="1" fill="#94A3B8" />

  <!-- DNA HELIX STRANDS -->
  <!-- Strand 1 (Back Strand - Platinum) with smooth cubic beziers -->
  <path
    d="M 22.5 5.5 C 23.5 10 19 13.5 16 16 C 13 18.5 8.5 22 9.5 26.5"
    stroke="url(#hsStrandBack)"
    stroke-width="2.4"
    stroke-linecap="round"
  />

  <!-- Strand 2 (Front Strand - Glowing Orange Flame) with shadow depth over center -->
  <path
    d="M 9.5 5.5 C 8.5 10 13 13.5 16 16 C 19 18.5 23.5 22 22.5 26.5"
    stroke="url(#hsStrandFront)"
    stroke-width="2.6"
    stroke-linecap="round"
    filter="url(#hsDepth)"
  />

  <!-- Terminal Nodes (5' and 3' ends) -->
  <circle cx="9.5" cy="5.5" r="1.5" fill="#FFA266" />
  <circle cx="22.5" cy="5.5" r="1.5" fill="#FFFFFF" />
  <circle cx="9.5" cy="26.5" r="1.5" fill="#CBD5E1" />
  <circle cx="22.5" cy="26.5" r="1.5" fill="#FF5500" />
</svg>